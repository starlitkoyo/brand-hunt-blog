# サイト全体の設定
# base_url を変えたら必ず `python build.py` を実行し直す（canonical と sitemap に入るため）。

name: "ルナのブランド巡回ノート"
base_url: "https://lunabrandhunt.com"
tagline: "Amazonでブランド品を買う前に、見ておきたいこと"
description: "バッグ・財布・時計まわりのブランド品をAmazonで買うときの見方をまとめています。販売元の確認、価格表示の読み方、サイズの選び方など。"
intro: "夜な夜なAmazonを巡回している「ルナ」が、ブランド品を買うときに実際に確認していることを書いています。"

disclosure: "当サイトはAmazonアソシエイト・プログラムに参加しています。記事内のリンクから購入された場合、当サイトに紹介料が発生することがあります。価格・在庫は掲載時点の情報です。"

about: |
  ## このサイトについて

  バッグ・財布・時計・ファッション小物まわりのブランド品を、Amazonで買うときの
  見方をまとめているサイトです。

  ## 書いている人

  「ルナ」と呼んでいます。夜な夜なAmazonを巡回して、ブランド品の価格が下がっていないかを見るのが習慣になりました。
  その過程で覚えた「ここを見ておくと後悔しにくい」という点を記事にしています。

  X（@luna_brandhunt）でも巡回の記録を置いています。

  ## このサイトで扱わないこと

  - 真贋の鑑定や判定
  - 特定の商品を買うようにすすめること
  - 根拠のない「最安」「お得」といった表現

  価格や在庫は変動します。実際の購入前には、必ずAmazonの商品ページで最新の情報をご確認ください。

  ## お問い合わせ

  Xのダイレクトメッセージからご連絡ください。

# ビルド時に検査する禁止表現（1つでも含まれているとビルドが失敗する）
banned_expressions:
  - "絶対"
  - "100%"
  - "今すぐ買うべき"
  - "本物保証"
  - "確実に本物"
  - "正規品"
  - "最安値保証"
  - "損しない"
  - "売り切れ確定"
  - "二度と出ない価格"
  - "Amazon公式商品"
  - "定価"
